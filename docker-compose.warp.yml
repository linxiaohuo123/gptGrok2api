services:
  warp-proxy:
    image: caomingjun/warp:latest
    container_name: chatgpt2api-warp-proxy
    restart: unless-stopped
    environment:
      WARP_SLEEP: "2"
      # 可选：填写 Cloudflare WARP+ License Key
      # WARP_LICENSE_KEY: ${WARP_LICENSE_KEY:-}
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    sysctls:
      net.ipv6.conf.all.disable_ipv6: 0
      net.ipv4.conf.all.src_valid_mark: 1
    ports:
      - "127.0.0.1:${WARP_SOCKS_PORT:-40000}:1080"
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import socket; s=socket.create_connection(('127.0.0.1', 1080), 5); s.close()\""]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

  privoxy:
    image: vimagick/privoxy:latest
    container_name: chatgpt2api-privoxy
    restart: unless-stopped
    depends_on:
      warp-proxy:
        condition: service_started
    volumes:
      - ./scripts/privoxy-warp.conf:/etc/privoxy/config:ro
    ports:
      - "127.0.0.1:${PRIVOXY_PORT:-40080}:8118"
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 8118 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s

  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    container_name: chatgpt2api-flaresolverr
    restart: unless-stopped
    environment:
      LOG_LEVEL: ${FLARESOLVERR_LOG_LEVEL:-info}
      TZ: ${TZ:-Asia/Shanghai}
    ports:
      - "127.0.0.1:${FLARESOLVERR_PORT:-8191}:8191"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8191/ >/dev/null"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  icloud-privacy-mail:
    profiles: ["local-icloud"]
    build:
      context: .
      dockerfile: deploy/icloud-privacy-mail/Dockerfile
    image: ${ICLOUD_PRIVACY_MAIL_IMAGE:-chatgpt2api/icloud-privacy-mail:2026.07.14.1}
    container_name: chatgpt2api-icloud-privacy-mail
    restart: unless-stopped
    ports:
      - "127.0.0.1:${ICLOUD_PRIVACY_MAIL_PORT:-8788}:8787"
    depends_on:
      privoxy:
        condition: service_healthy
    environment:
      IPM_API_KEY: ${ICLOUD_PRIVACY_MAIL_API_KEY:-}
      IPM_PUBLIC_BASE_URL: ${ICLOUD_PRIVACY_MAIL_PUBLIC_BASE_URL:-http://icloud-privacy-mail:8787}
      IPM_UPDATE_ENABLED: "false"
      HTTP_PROXY: ${ICLOUD_PRIVACY_MAIL_HTTP_PROXY:-http://privoxy:8118}
      HTTPS_PROXY: ${ICLOUD_PRIVACY_MAIL_HTTPS_PROXY:-http://privoxy:8118}
      NO_PROXY: ${ICLOUD_PRIVACY_MAIL_NO_PROXY:-127.0.0.1,localhost,icloud-privacy-mail,.apple.com,.icloud.com,.apple.com.cn,.icloud.com.cn}
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
      - ./data/icloud-privacy-mail:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8787/login >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 10s

  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: ${CHATGPT2API_IMAGE:-chatgpt2api:local-warp}
    container_name: chatgpt2api-warp
    restart: unless-stopped
    depends_on:
      privoxy:
        condition: service_started
      flaresolverr:
        condition: service_started
    ports:
      - "${CHATGPT2API_PORT:-3000}:80"
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./config.json:/app/config.json
    environment:
      STORAGE_BACKEND: ${STORAGE_BACKEND:-json}
      DATABASE_URL: ${DATABASE_URL:-}
      GIT_REPO_URL: ${GIT_REPO_URL:-}
      GIT_TOKEN: ${GIT_TOKEN:-}
      GIT_BRANCH: ${GIT_BRANCH:-main}
      GIT_FILE_PATH: ${GIT_FILE_PATH:-accounts.json}
      GIT_AUTH_KEYS_FILE_PATH: ${GIT_AUTH_KEYS_FILE_PATH:-auth_keys.json}
      CHATGPT2API_AUTH_KEY: ${CHATGPT2API_AUTH_KEY:-}
      CHATGPT2API_ADMIN_KEY: ${CHATGPT2API_ADMIN_KEY:-}
      CHATGPT2API_BASE_URL: ${CHATGPT2API_BASE_URL:-}
      CHATGPT2API_TRUST_REQUEST_HOST: ${CHATGPT2API_TRUST_REQUEST_HOST:-false}
      CHATGPT2API_ALLOW_PRIVATE_IMAGE_URLS: ${CHATGPT2API_ALLOW_PRIVATE_IMAGE_URLS:-false}
      CHATGPT2API_THREAD_TOKENS: ${CHATGPT2API_THREAD_TOKENS:-80}
      CHATGPT2API_IMAGE_MAX_INFLIGHT: ${CHATGPT2API_IMAGE_MAX_INFLIGHT:-12}
      CHATGPT2API_IMAGE_QUEUE_TIMEOUT_SECS: ${CHATGPT2API_IMAGE_QUEUE_TIMEOUT_SECS:-30}
      IMAGE_SCHEDULER_INTERNAL_KEY: ${IMAGE_SCHEDULER_INTERNAL_KEY:-}
      CHATGPT2API_HOST_PRIVOXY_URL: ${CHATGPT2API_HOST_PRIVOXY_URL:-http://privoxy:8118}
      ICLOUD_PRIVACY_MAIL_BASE_URL: ${ICLOUD_PRIVACY_MAIL_BASE_URL:-http://icloud-privacy-mail:8787}
      # 必须与 sidecar 的 IPM_API_KEY 成对：主程序只在密钥非空时才带 Authorization，
      # 而 sidecar 在期望值为空时直接拒绝。此前这里只给了 BASE_URL，iCloud 取号 100% 401。
      ICLOUD_PRIVACY_MAIL_API_KEY: ${ICLOUD_PRIVACY_MAIL_API_KEY:-}
      TZ: ${TZ:-Asia/Shanghai}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/health >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
